<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; font-family: 'IBM Plex Sans','Noto Sans Devanagari',system-ui,sans-serif; font-size: 13px; color: #1B1D21; background: transparent; }
  .bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  button { font: 500 13px inherit; font-family: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid #E2E0DA; background: #fff; color: #1B1D21; cursor: pointer; transition: border-color .12s; }
  button:hover { border-color: #6B6F78; } button[aria-pressed="true"] { background: #1B1D21; color: #fff; }
  .note { color: #6B6F78; font-size: 12px; }
</style>
</head>
<body>
<div class="bar"><button id="read" type="button"></button><button id="mute" type="button" aria-pressed="false"></button><span class="note" id="note"></span></div>
<script>
// Read-aloud with the browser's own speechSynthesis. It speaks only after a click (browser autoplay
// rules), the persona changes rate and pitch only, the text is always shown by the page, and the mute
// choice is remembered. If no voice exists for the language it falls back to text and says so.
(function () {
  const post = (m) => window.parent.postMessage(Object.assign({ isStreamlitMessage: true }, m), "*");
  let args = null;
  const $ = (id) => document.getElementById(id);
  const muted = () => { try { return localStorage.getItem("suraag_mute") === "1"; } catch (e) { return false; } };
  const setMuted = (v) => { try { localStorage.setItem("suraag_mute", v ? "1" : "0"); } catch (e) {} };
  function pickVoice(lang) {
    const want = lang === "hi" ? ["hi-IN", "hi"] : ["en-IN", "en"];
    const voices = speechSynthesis.getVoices();
    for (const w of want) { const v = voices.find((x) => x.lang === w || x.lang.startsWith(w)); if (v) return v; }
    return null;
  }
  function paint() {
    if (!args) return;
    $("read").textContent = args.labels.read;
    $("mute").textContent = args.labels.mute;
    $("mute").setAttribute("aria-pressed", muted() ? "true" : "false");
    $("note").textContent = "";
  }
  $("read").addEventListener("click", () => {
    if (!args || muted() || !("speechSynthesis" in window)) return;
    const voice = pickVoice(args.lang);
    if (args.lang === "hi" && !voice) { $("note").textContent = args.labels.no_voice; return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(args.text);
    if (voice) { u.voice = voice; u.lang = voice.lang; } else { u.lang = "en-IN"; }
    u.rate = args.rate; u.pitch = args.pitch;
    speechSynthesis.speak(u);
  });
  $("mute").addEventListener("click", () => { const v = !muted(); setMuted(v); if (v) speechSynthesis.cancel(); paint(); });
  window.addEventListener("message", (e) => {
    if (e.data && e.data.type === "streamlit:render") { args = e.data.args; paint(); post({ type: "streamlit:setFrameHeight", height: 44 }); }
  });
  if ("speechSynthesis" in window) speechSynthesis.onvoiceschanged = paint;
  post({ type: "streamlit:componentReady", apiVersion: 1 });
})();
</script>
</body>
</html>
